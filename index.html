<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>VeloTracker</title>
  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" sizes="180x180" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAAzUlEQVR4AZSRsQ7BYBSFi4SnsPAGNoNFImITBotFvIXJIJ7BZpAwGCRiIRIxmgnPQiR8p0lvmr9tmjb3623Pvefm/m3ey3ilGa7Mu4BFkqFKRwV+8AWLOEOD6h0eMIEWWLiGMpUz5GAOB5jBFPxwDRKlabIauwixK5UoDKAOPdDEGvkGL3hCETxNU95y07Q+eQgL6EBYX/FuhiYvIxhDG95QAB04rJtBB13SIE5kfXv9gyPP0oR0M2j/PcU1aKXA4Opm0AobmnfwgSAi+h8AAP//w58gRwAAAAZJREFUAwBpnCsZFl7H2gAAAABJRU5ErkJggg==">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      background: #000000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .app-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 30% 30%, #1a1a1a 0%, #000000 70%);
      z-index: -1;
    }
    .splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1), visibility 0.8s;
      backdrop-filter: blur(20px);
    }
    .splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-content {
      text-align: center;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #planetCanvas {
      width: 100%;
      height: 55vh;
      cursor: grab;
      transition: transform 0.2s ease;
    }
    #planetCanvas:active {
      cursor: grabbing;
      transform: scale(0.98);
    }
    .splash-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: #fff;
      margin-top: 20px;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
    }
    .splash-sub {
      font-size: 0.75rem;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 30px;
      text-transform: uppercase;
    }
    .start-btn {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 60px;
      padding: 16px 48px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(105deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .start-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 15px 30px -5px rgba(255, 255, 255, 0.1);
    }
    .start-btn:active {
      transform: scale(0.96);
    }
    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .app.visible {
      display: block;
      opacity: 1;
    }
    .map-fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #000000;
      filter: brightness(0.9) contrast(1.1);
    }
    .close-map-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(16px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      border: 1px solid rgba(255,255,255,0.2);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      transform: scale(0.9);
    }
    .close-map-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }
    .close-map-btn i {
      font-size: 1.6rem;
      color: #fff;
    }
    .control-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 32px 32px 0 0;
      padding: 24px 20px 32px;
      z-index: 10;
      transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
    }
    .control-panel.hidden {
      transform: translateY(105%);
      opacity: 0;
      pointer-events: none;
    }
    .records-panel {
      background: rgba(30, 30, 30, 0.6);
      border-radius: 24px;
      padding: 14px 18px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
    }
    .records-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #7a7a7a;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .records-grid {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .record-item {
      flex: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      padding: 10px 6px;
      transition: background 0.2s;
    }
    .record-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .record-label {
      font-size: 0.55rem;
      color: #666;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-block {
      flex: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 24px;
      padding: 16px 10px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.03);
      transition: transform 0.2s, background 0.2s;
    }
    .stat-block:hover {
      background: rgba(255,255,255,0.06);
      transform: translateY(-2px);
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .stat-label {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 6px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-bottom: 28px;
    }
    .ctrl-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(30, 30, 30, 0.7);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .ctrl-btn i {
      font-size: 2rem;
      color: #ddd;
    }
    .btn-start {
      background: #ffffff;
      box-shadow: 0 8px 25px rgba(255,255,255,0.2);
    }
    .btn-start i {
      color: #000000;
    }
    .ctrl-btn:active {
      transform: scale(0.9);
    }
    .tabs {
      display: flex;
      gap: 8px;
      background: rgba(40, 40, 40, 0.5);
      border-radius: 60px;
      padding: 5px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 8px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
    }
    .tab.active {
      background: #fff;
      color: #000;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .tab i {
      font-size: 1.1rem;
      margin-right: 6px;
      vertical-align: middle;
    }
    .tab-content {
      max-height: 300px;
      overflow-y: auto;
      padding: 4px;
      scrollbar-width: thin;
      scrollbar-color: #444 #111;
    }
    .history-item {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid transparent;
    }
    .history-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255,255,255,0.12);
      transform: translateX(6px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
    .btn-glass {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 14px;
      width: 100%;
      font-weight: 600;
      color: #ccc;
      cursor: pointer;
      margin-top: 12px;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-glass:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .reminder-box, .weather-box {
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    input[type="time"] {
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 30px;
      padding: 10px 18px;
      color: white;
      font-weight: 500;
      outline: none;
    }
    footer {
      text-align: center;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.2);
      margin-top: 18px;
      letter-spacing: 0.5px;
    }
    @media (max-width: 480px) {
      .ctrl-btn {
        width: 64px;
        height: 64px;
      }
      .stat-value {
        font-size: 1.8rem;
      }
    }
  </style>

<body>
<div class="splash" id="splashScreen">
  <div class="splash-content">
    <canvas id="planetCanvas"></canvas>
    <div class="splash-title">VELOTRACKER</div>
    <div class="splash-sub">The cycle more than a vehicle!</div>
    <button class="start-btn" id="startJourneyBtn">START THE JOURNEY!</button>
  </div>
</div>

<div class="app" id="mainApp">
  <div class="app-bg"></div>
  <div class="map-fullscreen" id="mapContainer">
    <div id="map"></div>
  </div>
  <div class="close-map-btn" id="closeMapBtn"><i class='bx bx-x'></i></div>
  <div class="control-panel" id="controlPanel">
    <div class="records-panel">
      <div class="records-title"><i class='bx bx-trophy'></i> личные рекорды</div>
      <div class="records-grid">
        <div class="record-item"><div class="record-value" id="bestDist">0</div><div class="record-label">макс км</div></div>
        <div class="record-item"><div class="record-value" id="bestAvg">0</div><div class="record-label">ср. скорость</div></div>
        <div class="record-item"><div class="record-value" id="bestTime">0</div><div class="record-label">макс мин</div></div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-block"><div class="stat-value" id="timeDisplay">00:00:00</div><div class="stat-label">время</div></div>
      <div class="stat-block"><div class="stat-value" id="distanceDisplay">0.00</div><div class="stat-label">км</div></div>
    </div>
    <div class="stats-row">
      <div class="stat-block"><div class="stat-value" id="speedCurrent">0.0</div><div class="stat-label">скорость</div></div>
      <div class="stat-block"><div class="stat-value" id="speedAvg">0.0</div><div class="stat-label">средняя</div></div>
    </div>
    <div class="controls">
      <div class="ctrl-btn btn-start" id="startBtn"><i class='bx bx-play'></i></div>
      <div class="ctrl-btn" id="pauseBtn"><i class='bx bx-pause'></i></div>
      <div class="ctrl-btn" id="stopBtn"><i class='bx bx-stop'></i></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="history"><i class='bx bx-history'></i> история</div>
      <div class="tab" data-tab="stats"><i class='bx bx-line-chart'></i> графики</div>
      <div class="tab" data-tab="tools"><i class='bx bx-cog'></i> инструменты</div>
    </div>
    <div id="historyTab" class="tab-content">
      <div id="historyList"></div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-glass" id="exportCSVBtn" style="flex:1;"><i class='bx bx-download'></i> CSV</button>
        <button class="btn-glass" id="clearHistoryBtn" style="flex:1; background: rgba(255,80,80,0.15); border-color: rgba(255,80,80,0.3);"><i class='bx bx-trash'></i> очистить</button>
      </div>
    </div>
    <div id="statsTab" class="tab-content" style="display:none;">
      <canvas id="distanceChart" style="max-height: 220px;"></canvas>
    </div>
    <div id="toolsTab" class="tab-content" style="display:none;">
      <div class="reminder-box"><span><i class='bx bx-bell'></i> напоминание</span><input type="time" id="reminderTime" value="18:00"><button class="btn-glass" id="setReminderBtn" style="width:auto; padding:8px 20px;">уст.</button></div>
      <div class="weather-box"><span><i class='bx bx-cloud'></i> погода</span><span id="weatherText">загрузка...</span></div>
      <button class="btn-glass" id="exportGPXBtn"><i class='bx bx-map-alt'></i> экспорт GPX</button>
    </div>
    <footer>VeloTracker • The style of life</footer>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

  const canvas = document.getElementById('planetCanvas');
  const scene = new THREE.Scene();
  scene.background = null;
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.set(0, 0, 3.5);
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });

  function resizeCanvas() {
    const container = canvas.parentElement;
    const width = container.clientWidth;
    const height = Math.min(450, window.innerHeight * 0.5);
    canvas.width = width;
    canvas.height = height;
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Ночная планета: чёрная с огнями городов (без дополнительной цветной подсветки)
  const textureLoader = new THREE.TextureLoader();
  const earthLightsMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_lights_2048.png');
  const geometry = new THREE.SphereGeometry(1.2, 128, 128);
  const material = new THREE.MeshBasicMaterial({ map: earthLightsMap });
  const earth = new THREE.Mesh(geometry, material);
  scene.add(earth);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;
  controls.enableZoom = true;
  controls.zoomSpeed = 0.7;
  controls.rotateSpeed = 0.7;
  controls.enablePan = false;
  controls.target.set(0, 0, 0);

  let interactionTimeout;
  controls.domElement.addEventListener('mousedown', () => { controls.autoRotate = false; clearTimeout(interactionTimeout); });
  controls.domElement.addEventListener('mouseup', () => { interactionTimeout = setTimeout(() => { controls.autoRotate = true; }, 1800); });
  controls.domElement.addEventListener('touchstart', () => { controls.autoRotate = false; clearTimeout(interactionTimeout); });
  controls.domElement.addEventListener('touchend', () => { interactionTimeout = setTimeout(() => { controls.autoRotate = true; }, 1800); });

  function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
  animate();
</script>

<script type="text/javascript">
  (function() {
    function vibrate() { if (window.navigator?.vibrate) window.navigator.vibrate(25); }
    async function sendNotification(title, body) {
      if (Notification.permission === "granted") new Notification(title, { body });
      else if (Notification.permission !== "denied") {
        await Notification.requestPermission();
        if (Notification.permission === "granted") new Notification(title, { body });
      }
    }

    let map, polyline, currentPosition = null, positions = [], tracking = false, paused = false;
    let startTime = null, pauseTime = 0, timerInterval = null, totalDistance = 0, maxSpeed = 0;
    let history = [], bikeMarker = null, watchId = null;

    // Монохромная иконка велосипеда (белая)
    const customIcon = L.divIcon({
      html: `<div style="filter: drop-shadow(0 4px 8px rgba(255,255,255,0.3)); transition: transform 0.2s;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="19" r="2" stroke="#ffffff" stroke-width="2" fill="none"/>
          <circle cx="8" cy="19" r="2" stroke="#ffffff" stroke-width="2" fill="none"/>
          <path d="M16 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" fill="#ffffff"/>
          <path d="M16.41 11H20V9h-3.59l-3-3c-.78-.78-2.05-.78-2.83 0L7.99 8.59c-.78.78-.78 2.05 0 2.83l3 3v4.59h2v-4.59c0-.53-.21-1.04-.59-1.41l-2-2 2.59-2.59 2 2c.38.38.88.59 1.41.59Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>`,
      iconSize: [36, 36],
      className: ''
    });

    function initMap() {
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([55.751244, 37.618423], 13);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);
      polyline = L.polyline([], { color: '#ffffff', weight: 5, opacity: 0.9, smoothFactor: 1 }).addTo(map);
    }

    function updatePosition(position) {
      if (!tracking || paused) return;
      const lat = position.coords.latitude, lng = position.coords.longitude, now = Date.now();
      if (currentPosition) {
        const R = 6371, dLat = (lat - currentPosition.lat) * Math.PI/180, dLng = (lng - currentPosition.lng) * Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(currentPosition.lat * Math.PI/180) * Math.cos(lat * Math.PI/180) * Math.sin(dLng/2)**2;
        const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        totalDistance += dist;
        const dt = (now - currentPosition.timestamp) / 3600000;
        const speed = dt > 0 ? dist / dt : 0;
        if (speed > maxSpeed) maxSpeed = speed;
        document.getElementById('distanceDisplay').innerText = totalDistance.toFixed(2);
        document.getElementById('speedCurrent').innerText = speed.toFixed(1);
        positions.push({lat, lng, timestamp: now});
        polyline.setLatLngs(positions.map(p => [p.lat, p.lng]));
        if (bikeMarker) map.removeLayer(bikeMarker);
        bikeMarker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
        if (positions.length > 1) map.fitBounds(polyline.getBounds(), { padding: [50,50], maxZoom: 17 });
      } else {
        positions.push({lat, lng, timestamp: now});
        bikeMarker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
      }
      currentPosition = { lat, lng, timestamp: now };
    }

    async function startTracking() {
      if (tracking && !paused) return;
      if (paused) { paused = false; startTime = Date.now() - pauseTime; startTimer(); return; }
      await new Promise((resolve) => navigator.geolocation.getCurrentPosition((pos) => {
        currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: Date.now() };
        resolve();
      }, () => resolve(), { enableHighAccuracy: true, timeout: 5000 }));
      if (!currentPosition) { alert("Не удалось определить местоположение"); return; }
      map.flyTo([currentPosition.lat, currentPosition.lng], 5, { duration: 0.6 });
      setTimeout(() => { map.flyTo([currentPosition.lat, currentPosition.lng], 17, { duration: 1 }); }, 700);
      setTimeout(() => { vibrate(); }, 1200);
      setTimeout(() => {
        tracking = true; paused = false;
        positions = []; totalDistance = 0; maxSpeed = 0; currentPosition = null;
        startTime = Date.now(); pauseTime = 0;
        polyline.setLatLngs([]);
        document.getElementById('distanceDisplay').innerText = '0.00';
        document.getElementById('speedCurrent').innerText = '0.0';
        document.getElementById('speedAvg').innerText = '0.0';
        startTimer();
        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(updatePosition, console.error, { enableHighAccuracy: true });
      }, 1800);
    }

    function pauseTracking() { if (tracking && !paused) { paused = true; if (timerInterval) clearInterval(timerInterval); } }
    async function stopTracking() {
      if (!tracking) return;
      tracking = false; paused = false;
      if (timerInterval) clearInterval(timerInterval);
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      if (positions.length > 1) {
        const duration = pauseTime + (Date.now() - startTime);
        const avgSpeed = totalDistance / (duration / 3600000);
        document.getElementById('speedAvg').innerText = avgSpeed.toFixed(1);
        const ride = { id: Date.now(), date: new Date().toISOString(), distance: totalDistance, duration, avgSpeed, maxSpeed, positions: positions.slice() };
        history.unshift(ride);
        if (history.length > 50) history.pop();
        localStorage.setItem('veloTracker_history', JSON.stringify(history));
        renderHistory(); updateRecords();
        await sendNotification('Поездка завершена', `${totalDistance.toFixed(1)} км за ${Math.floor(duration/60000)} мин`);
      }
      document.getElementById('timeDisplay').innerText = '00:00:00';
      document.getElementById('speedCurrent').innerText = '0.0';
      if (bikeMarker) map.removeLayer(bikeMarker);
      positions = []; totalDistance = 0; startTime = null; pauseTime = 0;
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!tracking || paused) return;
        const elapsed = pauseTime + (Date.now() - startTime);
        const hours = Math.floor(elapsed / 3600000);
        const minutes = Math.floor((elapsed % 3600000) / 60000);
        const seconds = Math.floor((elapsed % 60000) / 1000);
        document.getElementById('timeDisplay').innerText = `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
        if (totalDistance > 0 && elapsed > 0) document.getElementById('speedAvg').innerText = (totalDistance / (elapsed / 3600000)).toFixed(1);
      }, 400);
    }

    function updateRecords() {
      if (history.length === 0) { document.getElementById('bestDist').innerText = '0'; document.getElementById('bestAvg').innerText = '0'; document.getElementById('bestTime').innerText = '0'; return; }
      document.getElementById('bestDist').innerText = Math.max(...history.map(r => r.distance)).toFixed(1);
      document.getElementById('bestAvg').innerText = Math.max(...history.map(r => r.avgSpeed)).toFixed(1);
      document.getElementById('bestTime').innerText = Math.floor(Math.max(...history.map(r => r.duration)) / 60000);
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      if (!history.length) { container.innerHTML = '<div style="text-align:center;padding:30px;color:#555;"><i class="bx bx-bike" style="font-size:2rem;"></i><p>пока нет поездок</p></div>'; return; }
      let html = '';
      history.forEach((r, idx) => {
        const date = new Date(r.date).toLocaleDateString();
        const minutes = Math.floor(r.duration / 60000);
        html += `<div class="history-item" data-idx="${idx}"><strong>${date}</strong> — ${r.distance.toFixed(2)} км<br><small>⏱ ${minutes} мин | 🚴 ср. ${r.avgSpeed.toFixed(1)} км/ч | ⚡ макс. ${r.maxSpeed.toFixed(1)} км/ч</small></div>`;
      });
      container.innerHTML = html;
      document.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.idx);
          const ride = history[idx];
          if (ride && ride.positions && ride.positions.length) {
            polyline.setLatLngs(ride.positions.map(p => [p.lat, p.lng]));
            map.fitBounds(polyline.getBounds(), { padding: [40,40] });
          }
        });
      });
    }

    function clearHistory() {
      if (confirm('Удалить всю историю поездок?')) {
        history = [];
        localStorage.removeItem('veloTracker_history');
        renderHistory();
        updateRecords();
      }
    }

    let chart = null;
    function updateChart() {
      const ctx = document.getElementById('distanceChart').getContext('2d');
      const last7 = history.slice(0,7).reverse();
      if (chart) chart.destroy();
      if (last7.length === 0) return;
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: last7.map(r => new Date(r.date).toLocaleDateString()),
          datasets: [{ label: 'км', data: last7.map(r => r.distance), backgroundColor: '#ffffff', borderRadius: 10, barPercentage: 0.6 }]
        },
        options: { responsive: true, plugins: { legend: { labels: { color: '#aaa' } } }, scales: { y: { grid: { color: '#2a2a2a' } } } }
      });
    }

    function exportCSV() { let csv = "Date,Distance(km),Duration(ms),AvgSpeed(kmh),MaxSpeed(kmh)\n"; history.forEach(r => csv += `${r.date},${r.distance},${r.duration},${r.avgSpeed},${r.maxSpeed}\n`); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = `velotracker_${Date.now()}.csv`; a.click(); }
    function exportGPX() { if (!positions.length) { alert("нет активного маршрута"); return; } let gpx = `<?xml version="1.0"?><gpx version="1.1" creator="VeloTracker"><trk><name>Поездка</name><trkseg>\n`; positions.forEach(p => gpx += `<trkpt lat="${p.lat}" lon="${p.lng}"><time>${new Date(p.timestamp).toISOString()}</time></trkpt>\n`); gpx += `</trkseg></trk></gpx>`; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'})); a.download = `route_${Date.now()}.gpx`; a.click(); }
    function setReminder() { const time = document.getElementById('reminderTime').value; if (!time) return; const [h,m] = time.split(':').map(Number); let d = new Date(); d.setHours(h,m,0,0); if (d <= new Date()) d.setDate(d.getDate()+1); const ms = d - new Date(); if (window._reminderTimeout) clearTimeout(window._reminderTimeout); window._reminderTimeout = setTimeout(async () => { await sendNotification('VeloTracker', 'Пора на велосипед!'); setReminder(); }, ms); alert(`Напоминание установлено на ${time}`); }
    async function getWeather() { try { const pos = await new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000})); const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`); const d = await r.json(); document.getElementById('weatherText').innerHTML = `${d.current_weather.temperature}°C, ${d.current_weather.windspeed} км/ч`; } catch(e) { document.getElementById('weatherText').innerHTML = '—'; } }
    function switchTab(tabId) { document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none'); document.getElementById(tabId+'Tab').style.display = 'block'; document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active'); if (tabId === 'stats') updateChart(); }

    const mapContainer = document.getElementById('mapContainer');
    const controlPanel = document.getElementById('controlPanel');
    const closeMapBtn = document.getElementById('closeMapBtn');
    function enterFullscreenMap() { controlPanel.classList.add('hidden'); closeMapBtn.classList.add('visible'); }
    function exitFullscreenMap() { controlPanel.classList.remove('hidden'); closeMapBtn.classList.remove('visible'); }
    mapContainer.addEventListener('click', (e) => { if (e.target === mapContainer || e.target.closest('#map')) { if (!controlPanel.classList.contains('hidden')) enterFullscreenMap(); } });
    closeMapBtn.addEventListener('click', exitFullscreenMap);

    const splash = document.getElementById('splashScreen');
    const mainApp = document.getElementById('mainApp');
    document.getElementById('startJourneyBtn').addEventListener('click', () => {
      splash.classList.add('hide');
      setTimeout(() => {
        splash.style.display = 'none';
        mainApp.classList.add('visible');
        initMap();
        const saved = localStorage.getItem('veloTracker_history');
        if (saved) { history = JSON.parse(saved); renderHistory(); updateRecords(); }
        if ("geolocation" in navigator) navigator.geolocation.getCurrentPosition(pos => map.setView([pos.coords.latitude, pos.coords.longitude], 14));
        getWeather();
        setInterval(getWeather, 600000);
        if (Notification.permission === "default") Notification.requestPermission();
      }, 650);
    });
    document.getElementById('startBtn').addEventListener('click', startTracking);
    document.getElementById('pauseBtn').addEventListener('click', pauseTracking);
    document.getElementById('stopBtn').addEventListener('click', stopTracking);
    document.getElementById('exportCSVBtn').addEventListener('click', exportCSV);
    document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
    document.getElementById('exportGPXBtn').addEventListener('click', exportGPX);
    document.getElementById('setReminderBtn').addEventListener('click', setReminder);
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));
  })();
</script>
</body>
