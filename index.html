    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; font-weight: 600; background: #0a0a0a; color: #fff; overflow-x: hidden; }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }

        }
        
        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

        .start-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); border-color: rgba(255,255,255,0.4); }
        .start-btn:active { transform: scale(0.96); }
        
        .app { position: relative; min-height: 100vh; background: #0a0a0a; display: none; }
        .map-fullscreen { position: relative; width: 100%; height: 100vh; z-index: 1; }

        .close-map-btn { position: fixed; top: 20px; right: 20px; width: 48px; height: 48px; background: rgba(10,10,10,0.9); backdrop-filter: blur(12px); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; border: 1px solid rgba(255,255,255,0.15); opacity: 0; visibility: hidden; transition: all 0.2s ease; }

<body>

<div class="splash" id="splashScreen">
    <div class="splash-content">
        <canvas id="planetCanvas"></canvas>
        <div class="splash-title">VELOTRACKER</div>
        <div class="splash-sub">TRACK YOUR RIDE</div>
        <button class="start-btn" id="startJourneyBtn">START THE JOURNEY!</button>
    </div>
</div>

<div class="app" id="mainApp">
    <div class="map-fullscreen" id="mapContainer">
        <div id="map"></div>
    </div>
    <div class="close-map-btn" id="closeMapBtn"><i class='bx bx-x'></i></div>
    <div class="control-panel" id="controlPanel">
        <div class="records-panel"><div class="records-title"><i class='bx bx-trophy'></i> личные рекорды</div><div class="records-grid">
            <div class="record-item"><div class="record-value" id="bestDist">0</div><div class="record-label">макс км</div></div>
            <div class="record-item"><div class="record-value" id="bestAvg">0</div><div class="record-label">ср. скорость</div></div>
            <div class="record-item"><div class="record-value" id="bestTime">0</div><div class="record-label">макс мин</div></div>
        </div></div>
        <div class="stats-row"><div class="stat-block"><div class="stat-value" id="timeDisplay">00:00:00</div><div class="stat-label">время</div></div><div class="stat-block"><div class="stat-value" id="distanceDisplay">0.00</div><div class="stat-label">км</div></div></div>
        <div class="stats-row"><div class="stat-block"><div class="stat-value" id="speedCurrent">0.0</div><div class="stat-label">скорость</div></div><div class="stat-block"><div class="stat-value" id="speedAvg">0.0</div><div class="stat-label">средняя</div></div></div>
        <div class="controls"><div class="ctrl-btn btn-start" id="startBtn"><i class='bx bx-play'></i></div><div class="ctrl-btn" id="pauseBtn"><i class='bx bx-pause'></i></div><div class="ctrl-btn" id="stopBtn"><i class='bx bx-stop'></i></div></div>
        <div class="tabs"><div class="tab active" data-tab="history"><i class='bx bx-history'></i> история</div><div class="tab" data-tab="stats"><i class='bx bx-line-chart'></i> графики</div><div class="tab" data-tab="tools"><i class='bx bx-cog'></i> инструменты</div></div>
        <div id="historyTab" class="tab-content"><div id="historyList"></div><button class="btn-glass" id="exportCSVBtn"><i class='bx bx-download'></i> экспорт CSV</button></div>
        <div id="statsTab" class="tab-content" style="display:none;"><canvas id="distanceChart" style="max-height: 200px;"></canvas></div>
        <div id="toolsTab" class="tab-content" style="display:none;">
            <div class="reminder-box"><span><i class='bx bx-bell'></i> напоминание</span><input type="time" id="reminderTime" value="18:00"><button class="btn-glass" id="setReminderBtn" style="width:auto; padding:6px 16px;">уст.</button></div>
            <div class="weather-box"><span><i class='bx bx-cloud'></i> погода</span><span id="weatherText">загрузка...</span></div>
            <button class="btn-glass" id="exportGPXBtn"><i class='bx bx-map-alt'></i> экспорт GPX</button>
        </div>
        <footer>VeloTracker • нажми на карту для полноэкранного режима</footer>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';
    
    const canvas = document.getElementById('planetCanvas');
    const scene = new THREE.Scene();
    scene.background = null;
    
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 3.5);
    
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    
    function resizeCanvas() {
        const container = canvas.parentElement;
        const width = container.clientWidth;
        const height = 400;
        canvas.width = width;
        canvas.height = height;
        renderer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    const ambientLight = new THREE.AmbientLight(0x333333);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(5, 3, 5);
    scene.add(mainLight);
    const fillLight = new THREE.PointLight(0x4466cc, 0.3);
    fillLight.position.set(-2, 1, 3);
    scene.add(fillLight);
    
    const textureLoader = new THREE.TextureLoader();
    const earthMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const earthSpecularMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
    
    const geometry = new THREE.SphereGeometry(1.2, 128, 128);
    const material = new THREE.MeshPhongMaterial({ map: earthMap, specularMap: earthSpecularMap, specular: new THREE.Color('grey'), shininess: 5 });
    const earth = new THREE.Mesh(geometry, material);
    scene.add(earth);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.8;
    controls.rotateSpeed = 0.8;
    controls.enablePan = false;
    controls.target.set(0, 0, 0);
    
    let interactionTimeout;
    controls.domElement.addEventListener('mousedown', () => { controls.autoRotate = false; if (interactionTimeout) clearTimeout(interactionTimeout); });
    controls.domElement.addEventListener('mouseup', () => { interactionTimeout = setTimeout(() => { controls.autoRotate = true; }, 1500); });
    controls.domElement.addEventListener('touchstart', () => { controls.autoRotate = false; if (interactionTimeout) clearTimeout(interactionTimeout); });
    controls.domElement.addEventListener('touchend', () => { interactionTimeout = setTimeout(() => { controls.autoRotate = true; }, 1500); });
    
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
</script>

<script type="text/javascript">
    function vibrate() { if (window.navigator?.vibrate) window.navigator.vibrate(25); }
    async function sendNotification(title, body) { if (Notification.permission === "granted") new Notification(title, { body }); else if (Notification.permission !== "denied") { await Notification.requestPermission(); if (Notification.permission === "granted") new Notification(title, { body }); } }

    let map, polyline, currentPosition = null, positions = [], tracking = false, paused = false;
    let startTime = null, pauseTime = 0, timerInterval = null, totalDistance = 0, maxSpeed = 0;
    let history = [], bikeMarker = null, watchId = null;

    const bikeIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="1.5"><path d="M16.41 11H20V9h-3.59l-3-3c-.78-.78-2.05-.78-2.83 0L7.99 8.59c-.78.78-.78 2.05 0 2.83l3 3v4.59h2v-4.59c0-.53-.21-1.04-.59-1.41l-2-2 2.59-2.59 2 2c.38.38.88.59 1.41.59Z" fill="none" stroke="currentColor"/><circle cx="16" cy="19" r="2" fill="none" stroke="currentColor"/><circle cx="8" cy="19" r="2" fill="none" stroke="currentColor"/><path d="M16 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" fill="none" stroke="currentColor"/></svg>`;
    const customIcon = L.divIcon({ html: `<div style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">${bikeIconSvg}</div>`, iconSize: [32, 32], className: 'custom-bike-marker' });

    function initMap() { map = L.map('map').setView([55.751244, 37.618423], 13); L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap', subdomains: 'abcd', maxZoom: 19 }).addTo(map); polyline = L.polyline([], { color: '#ffffff', weight: 4, opacity: 0.8 }).addTo(map); }

    function updatePosition(position) {
        if (!tracking || paused) return;
        const lat = position.coords.latitude, lng = position.coords.longitude, now = Date.now();
        if (currentPosition) {
            const R = 6371, dLat = (lat - currentPosition.lat) * Math.PI/180, dLng = (lng - currentPosition.lng) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(currentPosition.lat * Math.PI/180) * Math.cos(lat * Math.PI/180) * Math.sin(dLng/2)**2;
            const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            totalDistance += dist;
            const dt = (now - currentPosition.timestamp) / 3600000;
            const speed = dt > 0 ? dist / dt : 0;
            if (speed > maxSpeed) maxSpeed = speed;
            document.getElementById('distanceDisplay').innerText = totalDistance.toFixed(2);
            document.getElementById('speedCurrent').innerText = speed.toFixed(1);
            positions.push({lat, lng, timestamp: now});
            polyline.setLatLngs(positions.map(p => [p.lat, p.lng]));
            if (bikeMarker) map.removeLayer(bikeMarker);
            bikeMarker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
            if (positions.length > 1) map.fitBounds(polyline.getBounds(), { padding: [40,40] });
        } else { positions.push({lat, lng, timestamp: now}); bikeMarker = L.marker([lat, lng], { icon: customIcon }).addTo(map); }
        currentPosition = { lat, lng, timestamp: now };
    }

    async function startTracking() {
        if (tracking && !paused) return;
        if (paused) { paused = false; startTime = Date.now() - pauseTime; startTimer(); return; }
        await new Promise((resolve) => navigator.geolocation.getCurrentPosition((pos) => { currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: Date.now() }; resolve(); }, () => resolve(), { enableHighAccuracy: true, timeout: 5000 }));
        if (!currentPosition) { alert("Не удалось определить местоположение"); return; }
        map.flyTo([currentPosition.lat, currentPosition.lng], 4, { duration: 0.8 });
        setTimeout(() => { map.flyTo([currentPosition.lat, currentPosition.lng], 17, { duration: 1.2 }); }, 900);
        setTimeout(() => { vibrate(); }, 1500);
        setTimeout(() => {
            tracking = true; paused = false;
            positions = []; totalDistance = 0; maxSpeed = 0; currentPosition = null;
            startTime = Date.now(); pauseTime = 0;
            polyline.setLatLngs([]);
            document.getElementById('distanceDisplay').innerText = '0.00';
            document.getElementById('speedCurrent').innerText = '0.0';
            document.getElementById('speedAvg').innerText = '0.0';
            startTimer();
            if (watchId) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(updatePosition, console.error, { enableHighAccuracy: true });
        }, 2000);
    }

    function pauseTracking() { if (tracking && !paused) { paused = true; if (timerInterval) clearInterval(timerInterval); } }
    
    async function stopTracking() {
        if (!tracking) return;
        tracking = false; paused = false;
        if (timerInterval) clearInterval(timerInterval);
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        if (positions.length > 1) {
            const duration = pauseTime + (Date.now() - startTime);
            const avgSpeed = totalDistance / (duration / 3600000);
            document.getElementById('speedAvg').innerText = avgSpeed.toFixed(1);
            const ride = { id: Date.now(), date: new Date().toISOString(), distance: totalDistance, duration, avgSpeed, maxSpeed, positions: positions.slice() };
            history.unshift(ride);
            if (history.length > 50) history.pop();
            localStorage.setItem('veloTracker_history', JSON.stringify(history));
            renderHistory(); updateRecords();
            await sendNotification('🚴 Поездка завершена!', `${totalDistance.toFixed(1)} км за ${Math.floor(duration/60000)} мин`);
        }
        document.getElementById('timeDisplay').innerText = '00:00:00';
        document.getElementById('speedCurrent').innerText = '0.0';
        if (bikeMarker) map.removeLayer(bikeMarker);
        positions = []; totalDistance = 0; startTime = null; pauseTime = 0;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!tracking || paused) return;
            const elapsed = pauseTime + (Date.now() - startTime);
            const hours = Math.floor(elapsed / 3600000);
            const minutes = Math.floor((elapsed % 3600000) / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            document.getElementById('timeDisplay').innerText = `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
            if (totalDistance > 0 && elapsed > 0) document.getElementById('speedAvg').innerText = (totalDistance / (elapsed / 3600000)).toFixed(1);
        }, 400);
    }

    function updateRecords() {
        if (history.length === 0) { document.getElementById('bestDist').innerText = '0'; document.getElementById('bestAvg').innerText = '0'; document.getElementById('bestTime').innerText = '0'; return; }
        const bestDist = Math.max(...history.map(r => r.distance));
        const bestAvg = Math.max(...history.map(r => r.avgSpeed));
        const bestTime = Math.max(...history.map(r => r.duration));
        document.getElementById('bestDist').innerText = bestDist.toFixed(1);
        document.getElementById('bestAvg').innerText = bestAvg.toFixed(1);
        document.getElementById('bestTime').innerText = Math.floor(bestTime / 60000);
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        if (!history.length) { container.innerHTML = '<div style="text-align:center;padding:20px;"><i class="bx bx-bike"></i> пока нет поездок</div>'; return; }
        let html = '';
        history.forEach((r, idx) => { const date = new Date(r.date).toLocaleDateString(); const minutes = Math.floor(r.duration / 60000); html += `<div class="history-item" data-idx="${idx}"><strong>${date}</strong> — ${r.distance.toFixed(2)} км<br><small>⏱ ${minutes} мин | 🚴 ср. ${r.avgSpeed.toFixed(1)} км/ч | ⚡ макс. ${r.maxSpeed.toFixed(1)} км/ч</small></div>`; });
        container.innerHTML = html;
        document.querySelectorAll('.history-item').forEach(el => { el.addEventListener('click', () => { const idx = parseInt(el.dataset.idx); const ride = history[idx]; if (ride && ride.positions && ride.positions.length) { const latlngs = ride.positions.map(p => [p.lat, p.lng]); polyline.setLatLngs(latlngs); map.fitBounds(polyline.getBounds(), { padding: [40,40] }); } }); });
    }

    let chart = null;
    function updateChart() { const ctx = document.getElementById('distanceChart').getContext('2d'); const last7 = history.slice(0,7).reverse(); const labels = last7.map(r => new Date(r.date).toLocaleDateString()); const distances = last7.map(r => r.distance); if (chart) chart.destroy(); chart = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: 'км', data: distances, backgroundColor: '#ffffff', borderRadius: 8, barPercentage: 0.6 }] }, options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#fff', font: { weight: 'bold' } } } } } }); }

    function exportCSV() { let csv = "Date,Distance(km),Duration(ms),AvgSpeed(kmh),MaxSpeed(kmh)\n"; history.forEach(r => csv += `${r.date},${r.distance},${r.duration},${r.avgSpeed},${r.maxSpeed}\n`); const blob = new Blob([csv], {type: 'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `velotracker_${Date.now()}.csv`; a.click(); }
    function exportGPX() { if (!positions.length) { alert("нет маршрута для экспорта"); return; } let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="VeloTracker">\n<trk><name>Велосипедная поездка</name><trkseg>\n`; positions.forEach(p => gpx += `<trkpt lat="${p.lat}" lon="${p.lng}"><time>${new Date(p.timestamp).toISOString()}</time></trkpt>\n`); gpx += `</trkseg></trk></gpx>`; const blob = new Blob([gpx], {type: 'application/gpx+xml'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `route_${Date.now()}.gpx`; a.click(); }
    function setReminder() { const time = document.getElementById('reminderTime').value; if (!time) return; const [hour, minute] = time.split(':').map(Number); let reminderDate = new Date(); reminderDate.setHours(hour, minute, 0, 0); if (reminderDate <= new Date()) reminderDate.setDate(reminderDate.getDate() + 1); const ms = reminderDate - new Date(); if (window._reminderTimeout) clearTimeout(window._reminderTimeout); window._reminderTimeout = setTimeout(async () => { await sendNotification('🚴 VeloTracker', 'Пора покататься!'); setReminder(); }, ms); alert(`напоминание на ${time}`); }
    async function getWeather() { try { const pos = await new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(res,rej)); const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`); const data = await resp.json(); document.getElementById('weatherText').innerHTML = `${data.current_weather.temperature}°C, ветер ${data.current_weather.windspeed} км/ч`; } catch(e) { document.getElementById('weatherText').innerHTML = '—'; } }
    function switchTab(tabId) { document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none'); document.getElementById(tabId+'Tab').style.display = 'block'; document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active'); if (tabId === 'stats') updateChart(); }

    const mapContainer = document.getElementById('mapContainer'); const controlPanel = document.getElementById('controlPanel'); const closeMapBtn = document.getElementById('closeMapBtn');
    function enterFullscreenMap() { controlPanel.classList.add('hidden'); closeMapBtn.classList.add('visible'); }
    function exitFullscreenMap() { controlPanel.classList.remove('hidden'); closeMapBtn.classList.remove('visible'); }
    mapContainer.addEventListener('click', (e) => { if (e.target === mapContainer || e.target.closest('#map')) { if (!controlPanel.classList.contains('hidden')) enterFullscreenMap(); } });
    closeMapBtn.addEventListener('click', exitFullscreenMap);

    const splash = document.getElementById('splashScreen'); const mainApp = document.getElementById('mainApp'); const startBtn = document.getElementById('startJourneyBtn');
    startBtn.addEventListener('click', () => { splash.classList.add('hide'); setTimeout(() => { splash.style.display = 'none'; mainApp.style.display = 'block'; initMap(); const saved = localStorage.getItem('veloTracker_history'); if (saved) { history = JSON.parse(saved); renderHistory(); updateRecords(); } if ("geolocation" in navigator) navigator.geolocation.getCurrentPosition(pos => map.setView([pos.coords.latitude, pos.coords.longitude], 14)); getWeather(); setInterval(getWeather, 600000); if (Notification.permission === "default") Notification.requestPermission(); }, 600); });
    document.getElementById('startBtn').addEventListener('click', startTracking); document.getElementById('pauseBtn').addEventListener('click', pauseTracking); document.getElementById('stopBtn').addEventListener('click', stopTracking); document.getElementById('exportCSVBtn').addEventListener('click', exportCSV); document.getElementById('exportGPXBtn').addEventListener('click', exportGPX); document.getElementById('setReminderBtn').addEventListener('click', setReminder); document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));
</script>
</body>
</html>
